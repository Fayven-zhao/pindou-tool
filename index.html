<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼豆图纸网格校准</title><style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;margin:0;color:#273143;background:#f4f6f9}header{padding:16px 24px;background:#fff;border-bottom:1px solid #ddd}h1{font-size:21px;margin:0}header p,.hint{color:#667085;font-size:13px}main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;max-width:1500px;padding:18px;margin:auto}.panel{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 10px #0001}label{display:block;font-size:14px;margin:12px 0 5px}input[type=number],input[type=file]{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bac5d1;border-radius:7px}button{padding:11px;border:0;border-radius:8px;background:#1968cd;color:white;cursor:pointer;width:100%;margin-top:12px;font-weight:600}.sub{background:#eaf1f9;color:#234}#status{margin-top:12px;padding:12px;background:#eef4fa;border-radius:8px;font-size:13px;line-height:1.6}canvas{max-width:100%;height:auto;box-shadow:0 2px 8px #0002;touch-action:none}#stage{background:#e3e7ed;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px;border-radius:8px;min-height:400px}@media(max-width:780px){main{grid-template-columns:1fr;padding:8px}}</style></head><body><header><h1>拼豆图纸 · 网格检测与校准</h1><p>图片仅在本机浏览器处理。自动检测结果为候选，请人工核对后导出。当前版本不识别拼豆编号。</p></header><main><section class="panel"><b>1. 上传与检测</b><label>原始图纸（JPG / PNG）<input type="file" id="file" accept="image/png,image/jpeg"></label><button id="detect">自动检测网格</button><div id="status">请上传图片。</div><label>行数<input type="number" id="rows" min="1" max="400" value="97"></label><label>列数<input type="number" id="cols" min="1" max="400" value="97"></label><label><input type="checkbox" id="lines" checked> 显示网格线</label><button class="sub" id="reset">恢复自动检测的边界</button><button id="export">导出校准 JSON</button><p class="hint">可拖动图像中的四个绿色角点，调整网格边界。行列数可手动修改；校准后再导出供后续逐格识别使用。</p></section><section class="panel"><b>2. 网格叠加预览</b><div id="stage"><canvas id="canvas" width="650" height="600"></canvas></div><p class="hint">如果自动检测不正确，请手动校正。照片透视严重或纸张弯曲时，需要额外校正。</p></section></main><script>
const g=id=>document.getElementById(id),v=g("canvas"),c=v.getContext("2d"),s=g("status");let im=null,model=null,backup=null,filename="",drag=-1;
function say(t){s.textContent=t}
function paint(){c.clearRect(0,0,v.width,v.height);if(!im){c.fillStyle="#6b7280";c.fillText("请上传一张拼豆图纸",25,30);return}c.drawImage(im,0,0,v.width,v.height);if(!model)return;const p=model.corners.map(a=>[a[0]*v.width/im.width,a[1]*v.height/im.height]);const interp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];let rows=+g("rows").value,cols=+g("cols").value;if(g("lines").checked&&rows>0&&cols>0){c.lineWidth=.8;c.strokeStyle="rgba(0,218,185,.65)";c.beginPath();for(let i=0;i<=cols;i++){let a=interp(p[0],p[1],i/cols),b=interp(p[3],p[2],i/cols);c.moveTo(...a);c.lineTo(...b)}for(let i=0;i<=rows;i++){let a=interp(p[0],p[3],i/rows),b=interp(p[1],p[2],i/rows);c.moveTo(...a);c.lineTo(...b)}c.stroke()}c.lineWidth=2;c.strokeStyle="#ec5353";c.beginPath();c.moveTo(...p[0]);p.slice(1).forEach(pt=>c.lineTo(...pt));c.closePath();c.stroke();p.forEach(pt=>{c.beginPath();c.arc(...pt,7,0,Math.PI*2);c.fillStyle="#12cda9";c.fill();c.lineWidth=2;c.strokeStyle="#fff";c.stroke()})}
function resize(){let scale=Math.min(1,900/im.width,1000/im.height);v.width=Math.round(im.width*scale);v.height=Math.round(im.height*scale);paint()}
g("file").onchange=e=>{let f=e.target.files[0];if(!f)return;filename=f.name;let url=URL.createObjectURL(f),z=new Image();z.onload=()=>{im=z;model=null;resize();URL.revokeObjectURL(url);say("图片已读取："+im.width+" × "+im.height+"。点击自动检测。")};z.src=url};
function estimate(){let w=im.width,h=im.height,scale=Math.min(1,1400/Math.max(w,h));let W=Math.round(w*scale),H=Math.round(h*scale),off=document.createElement("canvas");off.width=W;off.height=H;let cc=off.getContext("2d",{willReadFrequently:true});cc.drawImage(im,0,0,W,H);let rgba=cc.getImageData(0,0,W,H).data,gray=new Float32Array(W*H);for(let i=0;i<gray.length;i++){let j=i*4;gray[i]=rgba[j]*.299+rgba[j+1]*.587+rgba[j+2]*.114}let X=new Float32Array(W),Y=new Float32Array(H),xa=Math.floor(W*.04),xb=Math.floor(W*.96),ya=Math.floor(H*.08),yb=Math.floor(H*.93);for(let y=ya;y<yb;y++)for(let x=xa;x<xb;x++){let k=y*W+x;if(x+1<xb)X[x]+=Math.abs(gray[k]-gray[k+1]);if(y+1<yb)Y[y]+=Math.abs(gray[k]-gray[k+W])}let period=(data,start,end)=>{let max=-1,best=14,phase=0;for(let p=7;p<=35;p+=.25)for(let off=0;off<p;off+=1){let sum=0,n=0;for(let i=start+off;i<end;i+=p){sum+=data[Math.round(i)]||0;n++}let score=sum/n;if(score>max){max=score;best=p;phase=(start+off)%p}}return {p:best,phase,score:max}};let ax=period(X,xa,xb),ay=period(Y,ya,yb);let cols=Math.round((W-12*scale)/ax.p),rows=Math.round((H-150*scale)/ay.p);cols=Math.max(1,Math.min(400,cols));rows=Math.max(1,Math.min(400,rows));let x0=ax.phase;while(x0>ax.p*.7)x0-=ax.p;let y0=ay.phase;while(y0<60*scale)y0+=ay.p;while(y0>110*scale)y0-=ay.p;let x1=x0+cols*ax.p,y1=y0+rows*ay.p;if(x1>W){x1=W-1;x0=x1-cols*ax.p}if(y1>H){y1=H-1;y0=y1-rows*ay.p}let to=x=>Math.round(x/scale*10)/10;return {rows,cols,imageWidth:w,imageHeight:h,corners:[[to(x0),to(y0)],[to(x1),to(y0)],[to(x1),to(y1)],[to(x0),to(y1)]],method:"edge-periodicity-heuristic",needsConfirmation:true}}
g("detect").onclick=()=>{if(!im){say("请先上传图片");return}say("正在计算候选网格…");setTimeout(()=>{try{model=estimate();backup=JSON.parse(JSON.stringify(model));g("rows").value=model.rows;g("cols").value=model.cols;say("候选结果："+model.rows+" 行 × "+model.cols+" 列。必须人工检查是否对齐。");paint()}catch(e){model={rows:+g("rows").value,cols:+g("cols").value,imageWidth:im.width,imageHeight:im.height,corners:[[0,0],[im.width,0],[im.width,im.height],[0,im.height]],method:"manual",needsConfirmation:true};backup=JSON.parse(JSON.stringify(model));paint();say("自动检测失败，请手动调整四角和行列数。")}},20)};
["rows","cols","lines"].forEach(id=>g(id).oninput=paint);g("reset").onclick=()=>{if(!backup)return;model=JSON.parse(JSON.stringify(backup));g("rows").value=model.rows;g("cols").value=model.cols;paint()};
function point(e){let box=v.getBoundingClientRect();return [(e.clientX-box.left)*v.width/box.width,(e.clientY-box.top)*v.height/box.height]}
v.onpointerdown=e=>{if(!model)return;let p=point(e),d=model.corners.map(a=>Math.hypot(a[0]*v.width/im.width-p[0],a[1]*v.height/im.height-p[1])),min=Math.min(...d);if(min<24){drag=d.indexOf(min);v.setPointerCapture(e.pointerId)}};
v.onpointermove=e=>{if(drag<0)return;let p=point(e);model.corners[drag]=[Math.max(0,Math.min(im.width,Math.round(p[0]*im.width/v.width))),Math.max(0,Math.min(im.height,Math.round(p[1]*im.height/v.height)))];paint()};v.onpointerup=()=>drag=-1;v.onpointercancel=()=>drag=-1;
g("export").onclick=()=>{if(!model){say("请先检测网格");return}let obj={...model,rows:+g("rows").value,cols:+g("cols").value,imageName:filename,confirmedByUser:true};let url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download="grid-calibration.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);say("已导出校准 JSON。")};paint();
</script></body></html>
